name: Darwin progress site

on:
  push:
    paths:
      - 'scripts/*darwin*.py'
      - 'scripts/tests/*darwin*.py'
      - '.codex/agents/*.toml'
      - 'AGENTS.md'
      - 'docs/DARWIN_SUBSYSTEM_OWNERS.json'
      - 'docs/DARWIN_CONTRACT_CATALOG.json'
      - 'docs/DARWIN_CONTRACT_LEDGER.json'
      - '.github/workflows/darwin-progress-pages.yml'
  pull_request:
    paths:
      - 'scripts/*darwin*.py'
      - 'scripts/tests/*darwin*.py'
      - '.codex/agents/*.toml'
      - 'AGENTS.md'
      - 'docs/DARWIN_SUBSYSTEM_OWNERS.json'
      - 'docs/DARWIN_CONTRACT_*.json'
      - '.github/workflows/darwin-progress-pages.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the generated seed-only diagnostic site to GitHub Pages'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate diagnostics
        run: python -m unittest discover -s scripts/tests -p '*darwin*.py'
      - name: Generate bounded seed-only view
        run: python scripts/generate_darwin_progress.py --output '${{ runner.temp }}/darwin-progress-site'
      - name: Upload reviewable static site
        uses: actions/upload-artifact@v4
        with:
          name: darwin-progress-site
          path: '${{ runner.temp }}/darwin-progress-site'
      - name: Package Pages artifact when publication is requested
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/upload-pages-artifact@v4
        with:
          path: '${{ runner.temp }}/darwin-progress-site'
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy requested diagnostic site
        id: deployment
        uses: actions/deploy-pages@v4
