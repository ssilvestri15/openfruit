name: Build OpenFruit Core (Windows)

on:
  # Builds run automatically only for release tags (release-openfruit.yml);
  # this check runs only when started by hand from the Actions page.
  workflow_dispatch:

jobs:
  build-windows:
    name: Build OpenFruit Core on Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup LLVM & Clang 20.1.8
        shell: pwsh
        run: |
          # The official LLVM installer, unpacked without running it (as the
          # former install-llvm action did), first on PATH for later steps.
          $Installer = Join-Path $env:RUNNER_TEMP "LLVM-20.1.8-win64.exe"
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-win64.exe" -OutFile $Installer
          $Target = "C:\Program Files\LLVM"
          & 7z x $Installer "-o$Target" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Unable to unpack LLVM 20.1.8" }
          Join-Path $Target "bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Clang Compiler
        run: |
          clang --version
          clang-cl /?

      - name: Build OpenFruit Core & Run Tests
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\openfruit\windows\build.ps1 -WithTests

      - name: Test OpenFruit CLI Help & Capabilities
        run: |
          $OpenFruitExe = Join-Path $env:LOCALAPPDATA "OpenFruit\bin\openfruit.exe"
          & $OpenFruitExe --help
          & $OpenFruitExe version
          & $OpenFruitExe capabilities

      - name: Package Binary Artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $OpenFruitExe = Join-Path $env:LOCALAPPDATA "OpenFruit\bin\openfruit.exe"
          $OpenIbExe = Join-Path $env:LOCALAPPDATA "OpenFruit\bin\openib.exe"
          Copy-Item -Path $OpenFruitExe -Destination "dist\" -Force
          Copy-Item -Path $OpenIbExe -Destination "dist\" -Force
          Copy-Item -Path "README.md" -Destination "dist\" -Force
          Compress-Archive -Path "dist\*" -DestinationPath "openfruit-windows-x64.zip"

      - name: Upload OpenFruit Core Artifact
        uses: actions/upload-artifact@v6
        with:
          name: openfruit-windows-x64
          path: openfruit-windows-x64.zip
          retention-days: 30
